# 在 GitHub 上編譯三個版本:
#   - linux-arm64:Jetson / Pi 5 機台
#   - linux-x64:Ubuntu 24.04 桌機
#   - windows-x64
# arm64 用 Ubuntu 22.04 編譯,機台系統只要等於或更新就能跑:JetPack 6 (22.04)、JetPack 7.x (24.04)、
# Pi OS Bookworm 都可以。不要改成 24.04 runner,否則 Pi 5 的 glibc 太舊會無法執行。
# 機台若是 JetPack 5 (Ubuntu 20.04),glibc 較舊,需改在機台上編譯。
#
# 每次 push 到 main 都會更新同一個 Release (tag `latest`),只保留最新版,下載網址固定:
#   https://github.com/<owner>/<repo>/releases/latest/download/<檔名>
#
# 自動更新 (lib/services/update_service.dart):run number 會編進 App (APP_BUILD),
# Release 另外放一份 version.json (最新的 run number 與各檔案的 SHA-256)。
# 已安裝的 App 讀到較大的 build 就下載對應平台的檔案、替換並重新啟動。
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      # Flutter 沒有提供 arm64 Linux 的 SDK 壓縮檔,直接 clone 指定版本
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          flutter config --enable-linux-desktop --no-analytics
          flutter pub get
          flutter build linux --release \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }}

      # 用 tar 打包,保留執行檔權限 (artifact 的 zip 會弄丟 +x)
      - name: Package bundle
        run: |
          tar -czf spoonfull-linux-${{ matrix.arch }}.tar.gz -C build/linux/${{ matrix.arch }}/release bundle

      - uses: actions/upload-artifact@v4
        with:
          name: spoonfull-linux-${{ matrix.arch }}
          path: spoonfull-linux-${{ matrix.arch }}.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter config --enable-windows-desktop --no-analytics
          flutter pub get
          flutter build windows --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}

      # 一併放入 VC++ runtime,沒裝 Visual C++ Redistributable 的電腦也能直接執行
      - name: Package
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          Compress-Archive -Path "$release\*" -DestinationPath spoonfull-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: spoonfull-windows-x64
          path: spoonfull-windows-x64.zip

  release:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-latest
    steps:
      - uses: actions/checkout@v4

      # 把 latest tag 移到這次的 commit (GITHUB_TOKEN 推的 tag 不會再觸發 workflow)
      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin latest

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # 同名檔案會被覆蓋,Release 永遠只有最新一份
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版
          make_latest: true
          body: |
            最新版 (commit ${{ github.sha }})

            | 檔案 | 適用 |
            |---|---|
            | spoonfull-linux-arm64.tar.gz | Jetson (JetPack 6 / 7)、Raspberry Pi 5 |
            | spoonfull-linux-x64.tar.gz | Ubuntu 24.04 |
            | spoonfull-windows-x64.zip | Windows 10 / 11 |
          files: |
            spoonfull-linux-arm64.tar.gz
            spoonfull-linux-x64.tar.gz
            spoonfull-windows-x64.zip

      # version.json 最後才換:安裝檔都到位後,已安裝的 App 才會看到新版
      - name: Publish version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          cat > version.json <<EOF
          {
            "build": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "assets": {
              "linux-arm64": {"file": "spoonfull-linux-arm64.tar.gz", "sha256": "$(sha spoonfull-linux-arm64.tar.gz)"},
              "linux-x64": {"file": "spoonfull-linux-x64.tar.gz", "sha256": "$(sha spoonfull-linux-x64.tar.gz)"},
              "windows-x64": {"file": "spoonfull-windows-x64.zip", "sha256": "$(sha spoonfull-windows-x64.zip)"}
            }
          }
          EOF
          python3 -m json.tool version.json
          gh release upload latest version.json --clobber
